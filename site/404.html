<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<script>
(function () {
  try {
    var t = localStorage.getItem("npn-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    var f = localStorage.getItem("npn-fontsize");
    if (f === "small" || f === "large") document.documentElement.dataset.fontsize = f;
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページが見つかりません｜看護薬理ノート</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="/">看護薬理ノート<span>NURSING PHARMA NOTE</span></a>
  </div>
</header>
<main>
  <div class="container empty-state">
    <h1>お探しのページが見つかりませんでした</h1>
    <p class="lede" style="margin:0 auto 24px;">薬品情報が更新されたか、URLが変更された可能性があります。</p>
    <p><a class="btn" href="/">トップページへ戻る</a></p>
  </div>
</main>
</body>
</html>
